matrix:
  include:
    - os: osx
      osx_image: xcode14
      language: node_js
      node_js: "20"
      env:
        - ELECTRON_CACHE=$HOME/.cache/electron
        - ELECTRON_BUILDER_CACHE=$HOME/.cache/electron-builder

cache:
  directories:
    - node_modules
    - $HOME/.cache/electron
    - $HOME/.cache/electron-builder

before_install:
  - brew install yarn

script:
  - |
    cd ElectronClient/app
    npm install
    yarn dist
